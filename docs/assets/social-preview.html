<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif;
    color: #f5f6f8;
    background:
      radial-gradient(900px 500px at 85% 15%, rgba(96, 140, 255, 0.22), transparent 60%),
      radial-gradient(700px 400px at 10% 110%, rgba(130, 90, 255, 0.18), transparent 60%),
      #0b0f1a;
    position: relative;
  }
  .stars span { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }
  .wrap { position: absolute; left: 88px; top: 110px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  h1 { font-size: 76px; font-weight: 700; letter-spacing: -2px; }
  p.tag { margin-top: 30px; font-size: 44px; line-height: 1.15; font-weight: 650; letter-spacing: -0.5px; color: #fff; }
  p.sub { margin-top: 18px; font-size: 26px; color: #8fb4ff; }
  .chips { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { font-size: 20px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); color: #c9cfdc; background: rgba(255,255,255,0.04); }
  .url { position: absolute; left: 88px; bottom: 56px; font-size: 22px; color: #7f8aa3; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  svg.flow { position: absolute; right: 56px; top: 92px; }
  .node rect { fill: #151b2b; stroke: rgba(255,255,255,0.16); stroke-width: 1.5; }
  .node.gate rect { stroke: #8fb4ff; }
  .node.rule rect { stroke: #6fcf97; }
  .node.end rect { fill: transparent; stroke-dasharray: 5 5; }
  .node.end text { fill: #8a94ab; font-weight: 500; }
  .node text { fill: #f5f6f8; font-size: 20px; font-weight: 600; }
  .node text.sub { fill: #8a94ab; font-size: 15px; font-weight: 400; }
  .edge { fill: none; stroke: #5f7bd6; stroke-width: 2.5; }
  .edge.fail { stroke: #9c6ad6; stroke-dasharray: 6 6; }
  .lbl { fill: #8a94ab; font-size: 14px; }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="wrap">
  <div class="brand">
    <svg width="92" height="92" viewBox="0 0 64 64" aria-hidden="true">
      <mask id="m"><rect width="64" height="64" fill="#fff"/><circle cx="42" cy="24" r="19" fill="#000"/></mask>
      <circle cx="30" cy="32" r="22" fill="#f5f6f8" mask="url(#m)"/>
      <circle cx="42" cy="24" r="19" fill="none" stroke="#8fb4ff" stroke-width="2.5"/>
    </svg>
    <h1>Night Shift</h1>
  </div>
  <p class="tag">Stop babysitting<br>your agents.</p>
  <p class="sub">Sleep is the feature.</p>
  <div class="chips">
    <span class="chip">Claude Code</span><span class="chip">Codex</span><span class="chip">pi</span><span class="chip">jev</span><span class="chip">Local first</span>
  </div>
</div>
<div class="url">github.com/xiduzo/nightshift</div>

<svg class="flow" width="560" height="460" viewBox="0 0 560 460" aria-hidden="true">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f7bd6"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9c6ad6"/></marker>
  </defs>
  <!-- edges: the watch-logs starter -->
  <path class="edge" d="M180,72 L288,72" marker-end="url(#a)"/>
  <text class="lbl" x="218" y="62">new</text>
  <path class="edge fail" d="M90,104 L90,196" marker-end="url(#b)"/>
  <text class="lbl" x="100" y="156">quiet</text>
  <path class="edge" d="M385,104 L385,196" marker-end="url(#a)"/>
  <text class="lbl" x="395" y="156">found</text>
  <path class="edge" d="M385,262 L385,354" marker-end="url(#a)"/>
  <text class="lbl" x="395" y="314">fix</text>

  <g class="node rule" transform="translate(0,40)">
    <rect width="180" height="64" rx="12"/>
    <text x="18" y="30">Read the logs</text><text class="sub" x="18" y="50">Rule · anything new?</text>
  </g>
  <g class="node" transform="translate(290,40)">
    <rect width="190" height="64" rx="12"/>
    <text x="18" y="30">Investigate</text><text class="sub" x="18" y="50">Sonnet, then Opus</text>
  </g>
  <g class="node end" transform="translate(0,198)">
    <rect width="180" height="64" rx="12"/>
    <text x="18" y="38">Nothing to do</text>
  </g>
  <g class="node gate" transform="translate(290,198)">
    <rect width="190" height="64" rx="12"/>
    <text x="18" y="30">Fix it?</text><text class="sub" x="18" y="50">Gate · waits for you</text>
  </g>
  <g class="node" transform="translate(290,356)">
    <rect width="190" height="64" rx="12"/>
    <text x="18" y="30">Fix and check</text><text class="sub" x="18" y="50">your test command</text>
  </g>
</svg>

<script>
  // Deterministic star field.
  let s = 7;
  const r = () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
  const box = document.getElementById("stars");
  for (let i = 0; i < 70; i++) {
    const el = document.createElement("span");
    el.style.left = `${r() * 1280}px`;
    el.style.top = `${r() * 640}px`;
    el.style.opacity = 0.15 + r() * 0.5;
    if (r() > 0.85) { el.style.width = el.style.height = "3px"; }
    box.appendChild(el);
  }
</script>
</body>
</html>
