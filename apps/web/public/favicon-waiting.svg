<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<title>Night Shift: a Gate waits for you</title>
	<style>
		.fg { fill: oklch(0.145 0 0); }
		.run { stroke: oklch(0.5 0.16 250); }
		.dot { fill: oklch(0.52 0.12 65); }
		@media (prefers-color-scheme: dark) {
			.fg { fill: oklch(0.985 0 0); }
			.run { stroke: oklch(0.74 0.13 245); }
			.dot { fill: oklch(0.83 0.14 80); }
		}
	</style>
	<mask id="m">
		<rect width="64" height="64" fill="#fff" />
		<circle cx="42" cy="24" r="19" fill="#000" />
	</mask>
	<mask id="cut">
		<rect width="64" height="64" fill="#fff" />
		<circle cx="50" cy="14" r="17" fill="#000" />
	</mask>
	<g mask="url(#cut)">
		<circle class="fg" cx="30" cy="32" r="22" mask="url(#m)" />
		<circle class="run" cx="42" cy="24" r="19" fill="none" stroke-width="2.5" />
	</g>
	<circle class="dot" cx="50" cy="14" r="13" />
</svg>
