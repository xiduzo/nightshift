# Keeps the logo of the README in the phase of the moon. Each day it writes
# the moon of now to moon.svg on the `moon` branch, and the README shows
# that file. The branch holds only that file, so main gets no commits.
# A push happens only when the phase changes, about every 3.7 days.
name: Moon

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moon
  cancel-in-progress: true

jobs:
  moon:
    name: Show the moon of today
    runs-on: ubuntu-24.04
    permissions:
      # Pushes the moon branch.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun scripts/moon-logo.ts "$RUNNER_TEMP/moon"

      - name: Push the moon branch
        run: |
          git fetch origin moon || true
          if git rev-parse --verify --quiet origin/moon; then
            git switch --discard-changes -C moon origin/moon
          else
            git switch --orphan moon
          fi
          git rm -rfq --ignore-unmatch . >/dev/null
          cp "$RUNNER_TEMP/moon/moon.svg" moon.svg
          git add moon.svg
          if git diff --cached --quiet; then
            echo "The phase did not change."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898333+github-actions[bot]@users.noreply.github.com" \
            commit -qm "chore: the moon of $(date -u +%F)"
          git push origin moon
