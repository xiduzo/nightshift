# Builds main every night and publishes it to the rolling `nightly`
# prerelease. Apps with "Get Nightly Builds" on update from there. A night
# without new commits is skipped. Run it from the Actions tab to build now.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: plan
        name: Plan the nightly build
        run: |
          sha="$(git rev-parse HEAD)"
          last="$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$sha" ]; then
            echo "The nightly build of $sha exists."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nightly builds are prereleases of the next patch version.
          stable="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$stable" ]; then
            IFS=. read -r major minor patch <<< "${stable#v}"
            next="$major.$minor.$((patch + 1))"
          else
            next="0.1.0"
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$next-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}
      feed: nightly
    secrets: inherit

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Move the nightly tag
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git tag -f nightly "$SHA"
          git push -f origin refs/tags/nightly

      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          notes="Night Shift $VERSION, built from $SHA. Nightly builds can break: use them to try what comes next."
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --verify-tag --prerelease \
              --title "Night Shift nightly" --notes "$notes"
          fi
          # update.json goes last: an app that checks during the upload must
          # never see a version whose files are not there yet.
          gh release upload nightly --clobber $(ls dist/* | grep -v -- '-update\.json$')
          gh release upload nightly --clobber dist/*-update.json
          # Drop the files of older nightly builds.
          gh release view nightly --json assets --jq '.assets[].name' | while read -r name; do
            [ -e "dist/$name" ] || gh release delete-asset nightly "$name" --yes
          done
          gh release edit nightly --prerelease --notes "$notes"
