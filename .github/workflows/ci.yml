# Checks every pull request and every push to main or arch/**: lint and format, the
# layer map, the verticals, types, the tests of each workspace, and that the
# compiled binary starts. The same commands run on your computer (see
# CONTRIBUTING.md, "Check your change").
#
# Branch protection on main requires the check "CI passed", the last job. So
# push a commit to arch/** or open a pull request first. Push it to main when
# that check is green. nightly.yml and release.yml read the same check. Do not
# rename it.
name: CI

on:
  pull_request:
  push:
    branches: [main, "arch/**"]

permissions:
  contents: read

# A pull request stops its older run. Each pushed commit has its own group: in
# a shared one, GitHub drops the waiting run when a newer commit arrives, and
# that commit never gets its "CI passed".
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, layers and types
    runs-on: ubuntu-24.04
    env:
      # The web build (part of check-types) requires it. Same value as the
      # desktop build.
      VITE_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Vite's prerender in the web build runs on Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Electrobun keeps its toolchain here. `electrobun prepare` (the desktop
      # type check) fills it.
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-check-linux-x64-${{ hashFiles('bun.lock') }}

      # postinstall generates the typed env files (varlock codegen).
      - run: bun install --frozen-lockfile

      - name: Biome
        run: bunx biome ci .

      - name: Layer map
        run: bun scripts/check-layers.ts

      - name: Semantic convention strings
        run: bun scripts/check-semconv.ts

      - name: Collector allowlist
        run: bun scripts/check-collector-allowlist.ts

      - name: Weaver registry
        run: |
          version=$(tr -d '[:space:]' < packages/telemetry/registry/weaver-version.txt)
          asset="weaver-x86_64-unknown-linux-gnu.tar.xz"
          curl -fsSL -o /tmp/weaver.tar.xz \
            "https://github.com/open-telemetry/weaver/releases/download/${version}/${asset}"
          mkdir -p /tmp/weaver
          tar -xJf /tmp/weaver.tar.xz -C /tmp/weaver
          bin=$(find /tmp/weaver -type f -name weaver -print -quit)
          "$bin" registry check --v2 --registry packages/telemetry/registry

      - name: Verticals
        run: bun scripts/check-verticals.ts

      - name: Capability map
        run: bun scripts/check-capabilities.ts

      - name: Clock
        run: bun scripts/check-time.ts

      # File size, folder size, barrel width and the peer ports: each has a
      # debt list that only gets shorter (scripts/check-budgets.ts).
      - name: Budgets
        run: bun scripts/check-budgets.ts

      # The rings of a slice in the server packages, and the list of the
      # verticals that are not in shape yet (scripts/check-rings.ts).
      - name: Rings
        run: bun run check:rings

      # The kits, starters, agents, CLI help and MCP tools in the docs match
      # the code (apps/server/scripts/docs-reference.ts).
      - name: Docs reference
        run: bun run docs:reference --check

      # A path that a living doc, the pre-commit hook or a workflow names
      # exists (scripts/check-doc-paths.ts).
      - name: Doc paths
        run: bun scripts/check-doc-paths.ts

      # The check scripts and the capability map are typed data and code
      # with no workspace of their own (scripts/tsconfig.json). The Types
      # step runs this too. Here it fails early, under its own name.
      - name: Types of the scripts
        run: bun run check-types:scripts

      - name: Tests of the checks
        run: bun test ./scripts/

      - name: Types
        run: bun run check-types

  # The Docker image (deploy/Dockerfile) runs the compiled binary. A binary
  # that stops at start leaves production on its old container, without an
  # error anywhere. This builds it and starts it as the image does.
  binary:
    name: Binary starts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Vite's prerender in the web build runs on Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Build the binary
        run: bun run --cwd apps/server build:binary

      # serve answers GET / with 200, health exits with 0, and pi-acp
      # answers over ACP. In a temporary folder, away from node_modules.
      - name: Start the binary
        timeout-minutes: 3
        run: bun apps/server/scripts/smoke-binary.ts

  # The workspaces with tests, found from the file system
  # (scripts/test-workspaces.ts), so a new workspace's tests run without an
  # edit here.
  workspaces:
    name: Find the tested workspaces
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The script uses Node's fs only: no install needed.
      - id: list
        run: echo "list=$(bun scripts/test-workspaces.ts)" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.workspace }})
    needs: workspaces
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.workspaces.outputs.list) }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Tests make git repositories and commit in them, as on a developer's
      # computer.
      - name: Git identity
        run: |
          git config --global user.name "Night Shift CI"
          git config --global user.email "ci@nightshift.invalid"

      # Every test file of the workspace except *.live.test.ts: those need
      # real services (for example a local Ollama).
      - name: Test
        working-directory: ${{ matrix.workspace }}
        timeout-minutes: 15
        run: |
          find . \( -name node_modules -o -name dist -o -name .hutch \) -prune -o \
            -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) \
            ! -name '*.live.test.ts' -print0 \
            | xargs -0 --no-run-if-empty bun test

  # The one check that branch protection, nightly.yml and release.yml read. It
  # always runs: GitHub counts a skipped required check as a pass. It passes
  # only when each job of `needs` succeeded, so a job that failed, was skipped
  # or was cancelled fails it. Add a new job to `needs`.
  passed:
    name: CI passed
    needs: [check, binary, workspaces, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Each job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS"
