# Releases one version of the desktop app and of the Docker image.
#
# - Run it from the Actions tab with a version (0.2.0): it tags the commit
#   you run it on as v0.2.0, builds, and publishes the release.
# - Or push a tag yourself: `git tag v0.2.0 && git push origin v0.2.0`.
#
# A version with a prerelease part (0.2.0-beta.1) becomes a prerelease. Apps
# on the stable feed skip it: they follow the latest full release only.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.2.0.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: version
        name: Resolve the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::\"$version\" is not a version such as 0.2.0 or 0.2.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN does not start this workflow again.
      - name: Tag the commit
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG exists. Choose a new version."
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  build:
    needs: tag
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      feed: stable
    secrets: inherit

  # The Docker image of the same version. A tag this workflow pushes starts
  # no other workflow, so it calls docker.yml itself.
  image:
    needs: tag
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      feed: stable
    secrets: inherit

  publish:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Night Shift $VERSION" \
            --generate-notes \
            "${prerelease[@]}"
