# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # The layer check reads the dependencies, the entries, what each file
    # imports and biome's allow-lists.
    - name: layers
      glob:
        - "package.json"
        - "**/package.json"
        - "**/tsconfig*.json"
        - "biome.json"
        - "*.{ts,tsx,js,mjs,cjs,css}"
      run: bun scripts/check-layers.ts
    # The vertical check reads the source, the entries and the path aliases.
    - name: verticals
      glob:
        - "*.{ts,tsx}"
        - "package.json"
        - "**/package.json"
        - "**/tsconfig.json"
      run: bun scripts/check-verticals.ts
    - name: time
      glob:
        - "*.{ts,tsx}"
        - "scripts/time-debt.txt"
      run: bun scripts/check-time.ts
    - name: check tests
      glob:
        - "scripts/check-*.ts"
        - "scripts/test-workspaces*.ts"
      run: bun test ./scripts/
