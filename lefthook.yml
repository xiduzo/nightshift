# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: layers
      glob:
        - "package.json"
        - "**/package.json"
        - "scripts/check-layers.ts"
      run: bun scripts/check-layers.ts
    - name: verticals
      glob: "*.{ts,tsx}"
      run: bun scripts/check-verticals.ts
    - name: check tests
      glob:
        - "scripts/check-*.ts"
        - "scripts/test-workspaces*.ts"
      run: bun test ./scripts/
