# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # The layer check reads the dependencies, the entries, what each file
    # imports and biome's allow-lists.
    - name: layers
      glob:
        - "package.json"
        - "**/package.json"
        - "**/tsconfig*.json"
        - "biome.json"
        - "*.{ts,tsx,js,mjs,cjs,css}"
      run: bun scripts/check-layers.ts
    # A gen_ai.* or nightshift.* string outside the generated package.
    - name: semconv
      glob:
        - "*.{ts,tsx}"
        - "packages/semconv/**"
        - "packages/telemetry/registry/**"
      run: bun scripts/check-semconv.ts
    # The Collector allowlist matches the usage export.
    - name: collector allowlist
      glob:
        - "deploy/insights/collector.yaml"
        - "packages/telemetry/src/usage/send.ts"
        - "packages/semconv/**"
        - "scripts/check-collector-allowlist.ts"
      run: bun scripts/check-collector-allowlist.ts
    # The vertical check reads the source, the entries, the path aliases and
    # its two debt lists.
    - name: verticals
      glob:
        - "*.{ts,tsx}"
        - "package.json"
        - "**/package.json"
        - "**/tsconfig.json"
        - "scripts/kind-folder-debt.txt"
        - "scripts/nesting-debt.txt"
      run: bun scripts/check-verticals.ts
    # The capability map names every vertical. It reads the same files.
    - name: capabilities
      glob:
        - "*.{ts,tsx}"
        - "package.json"
        - "**/package.json"
        - "**/tsconfig.json"
        - "scripts/capability-debt.txt"
        - "docs/glossary.md"
      run: bun scripts/check-capabilities.ts
    - name: time
      glob:
        - "*.{ts,tsx}"
        - "scripts/time-debt.txt"
      run: bun scripts/check-time.ts
    # File size, folder size, barrel width and the peer ports. Each has a
    # debt list, and each may only shrink.
    - name: budgets
      glob:
        - "*.{ts,tsx}"
        - "package.json"
        - "**/package.json"
        - "scripts/size-debt.txt"
        - "scripts/folder-debt.txt"
        - "scripts/barrel-debt.txt"
        - "scripts/peer-port-debt.txt"
      run: bun scripts/check-budgets.ts
    # The reference tables of the docs match the code.
    - name: docs reference
      glob:
        - "*.md"
        - "community/**"
        - "packages/flows/src/kits/**"
        - "packages/flows/src/starters/**"
        - "packages/flows/src/harnesses/**"
        - "packages/flows/src/flow/node.ts"
        - "packages/agents/src/assistant/**"
        - "packages/agents/src/knowledge/**"
        - "apps/server/src/features/cli/**"
        - "apps/server/scripts/docs-reference.ts"
      run: bun run docs:reference --check
    # The scripts of the repository have their own tsconfig. A wrong name on
    # the capability map is a type error.
    - name: script types
      glob:
        - "scripts/*.ts"
        - "scripts/**/*.ts"
        - "scripts/tsconfig.json"
        - "packages/config/tsconfig.base.json"
      run: bun run check-types:scripts
    - name: check tests
      glob:
        - "scripts/check-*.ts"
        - "scripts/verticals/**"
        - "scripts/capabilities.ts"
        - "scripts/capability-debt.txt"
        - "scripts/test-workspaces*.ts"
      run: bun test ./scripts/
