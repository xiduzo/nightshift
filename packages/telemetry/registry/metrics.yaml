file_format: definition/2
metrics:
  - name: nightshift.step.duration
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: How long a Command, Tool, Gate, or other step took.
    note: >
      An Agent step uses gen_ai.invoke_agent.duration.
      A tool an agent calls uses gen_ai.execute_tool.duration.
    stability: development
    attributes:
      - ref: nightshift.node.kind
        requirement_level: recommended
      - ref: nightshift.step.outcome
        requirement_level: recommended
      - ref: nightshift.project.id
        requirement_level: recommended
      - ref: nightshift.flow.id
        requirement_level: recommended
      - ref: nightshift.device.id
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: If the step failed.

  - name: nightshift.run.cost_usd
    requirement_level: recommended
    instrument: counter
    unit: "{USD}"
    brief: What runs cost, in US dollars.
    stability: development
    attributes:
      - ref: nightshift.cost.basis
        requirement_level: recommended
      - ref: nightshift.agent
        requirement_level: recommended
      - ref: gen_ai.request.model
        requirement_level: recommended
      - ref: nightshift.node.kind
        requirement_level: recommended
      - ref: nightshift.ladder.rung
        requirement_level:
          conditionally_required: When the step is a try on a ladder.
      - ref: nightshift.project.id
        requirement_level: recommended
      - ref: nightshift.flow.id
        requirement_level: recommended
      - ref: nightshift.device.id
        requirement_level: recommended

  - name: nightshift.ladder.rung
    requirement_level: recommended
    instrument: counter
    unit: "{step}"
    brief: Where the work landed. One point for each climb that landed, on the step it landed on.
    note: >
      A node without a cascade lands on each visit. The cost of a rung is
      nightshift.run.cost_usd with the same nightshift.ladder.rung.
    stability: development
    attributes:
      - ref: nightshift.ladder.kind
        requirement_level: required
      - ref: nightshift.ladder.rung
        requirement_level: required
      - ref: nightshift.ladder.tier
        requirement_level:
          conditionally_required: When the node has a cascade.
      - ref: nightshift.ladder.unsure
        requirement_level:
          conditionally_required: On the choice ladder.
      - ref: nightshift.node.kind
        requirement_level: recommended
      - ref: nightshift.project.id
        requirement_level: recommended
      - ref: nightshift.flow.id
        requirement_level: recommended
      - ref: nightshift.device.id
        requirement_level: recommended

  - name: nightshift.flow.metric
    requirement_level: recommended
    instrument: histogram
    unit: "{value}"
    brief: The numbers a flow reports. A Command, an Agent or a Value step writes them in its data.
    note: >
      The flow chooses each name and what its value means. A value is 0 or more.
    stability: development
    attributes:
      - ref: nightshift.flow.metric.name
        requirement_level: required
      - ref: nightshift.project.id
        requirement_level: recommended
      - ref: nightshift.flow.id
        requirement_level: recommended
      - ref: nightshift.device.id
        requirement_level: recommended

  - name: nightshift.retries
    requirement_level: recommended
    instrument: counter
    unit: "{step}"
    brief: Steps that ran again. A visit after the first.
    stability: development
    attributes:
      - ref: nightshift.node.kind
        requirement_level: recommended
      - ref: nightshift.project.id
        requirement_level: recommended
      - ref: nightshift.flow.id
        requirement_level: recommended
      - ref: nightshift.device.id
        requirement_level: recommended

  - name: nightshift.gate.wait
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: How long a Gate waited for a person.
    stability: development
    attributes:
      - ref: nightshift.node.kind
        requirement_level: recommended
      - ref: nightshift.project.id
        requirement_level: recommended
      - ref: nightshift.flow.id
        requirement_level: recommended
      - ref: nightshift.device.id
        requirement_level: recommended

  - name: nightshift.run.outcome
    requirement_level: recommended
    instrument: counter
    unit: "{run}"
    brief: Runs that ended, by how they ended.
    stability: development
    attributes:
      - ref: nightshift.run.status
        requirement_level: required
      - ref: nightshift.run.needed_you
        requirement_level: recommended
      - ref: nightshift.project.id
        requirement_level: recommended
      - ref: nightshift.flow.id
        requirement_level: recommended
      - ref: nightshift.device.id
        requirement_level: recommended

  - name: nightshift.score
    requirement_level: recommended
    instrument: counter
    unit: "{score}"
    brief: Feedback on runs. Gate answers, useful answers, and what became of a pull request.
    note: >
      A no to "Was this run useful?" adds 0. A changed answer adds its new
      value again. The run keeps only the latest answer. A number a flow
      reports is a nightshift.flow.metric point.
    stability: development
    attributes:
      - ref: nightshift.score.name
        requirement_level: required
      - ref: nightshift.score.label
        requirement_level: recommended
      - ref: nightshift.score.by
        requirement_level: recommended
      - ref: nightshift.project.id
        requirement_level: recommended
      - ref: nightshift.flow.id
        requirement_level: recommended
      - ref: nightshift.device.id
        requirement_level: recommended

imports:
  attribute_groups:
    - registry.os
    - registry.host
    - registry.service
    - registry.deployment
    - registry.error
  spans:
    - gen_ai.invoke_workflow.internal
    - gen_ai.invoke_agent.internal
    - gen_ai.execute_tool.internal
  metrics:
    - gen_ai.invoke_workflow.duration
    - gen_ai.invoke_agent.duration
    - gen_ai.execute_tool.duration
    - gen_ai.client.inference.usage.input_tokens
    - gen_ai.client.inference.usage.output_tokens
    - gen_ai.client.inference.usage.cache_read.input_tokens
    - gen_ai.client.inference.usage.cache_write.input_tokens
