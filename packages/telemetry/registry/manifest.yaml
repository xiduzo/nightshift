name: nightshift
description: >
  Night Shift telemetry. This registry defines the nightshift.* attributes,
  the Night Shift metrics, and the usage events. It takes standard names
  from the GenAI registry and from core semantic conventions.
file_format: definition_manifest/2.0
schema_url: https://nightshift.dev/schemas/0.1.0
stability: development
dependencies:
  # The GenAI schema is https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev.
  # The git tag gen-ai-dev/1.42.0-dev does not exist. This commit is main
  # at the time its manifest declares that schema_url.
  # renovate: datasource=git-refs depName=open-telemetry/semantic-conventions-genai
  - schema_url: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
    registry_path: https://github.com/open-telemetry/semantic-conventions-genai.git@244465e94b9d7167fa5ed5c31a4b2b49ab6ddee5[model]
  # Core semantic conventions 1.44.0. A direct dependency so resource
  # attributes (os.type, host.arch, service.version) can be referenced.
  # renovate: datasource=github-tags depName=open-telemetry/semantic-conventions versioning=semver-coerced
  - schema_url: https://opentelemetry.io/schemas/1.44.0
    registry_path: https://github.com/open-telemetry/semantic-conventions.git@v1.44.0[model]
