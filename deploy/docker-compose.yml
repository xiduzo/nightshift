# Night Shift behind Caddy, which gets and renews the certificate itself.
#
#   NIGHTSHIFT_DOMAIN=nightshift.example.com docker compose -f deploy/docker-compose.yml up -d
#
# Point the domain's DNS at this server and open ports 80 and 443 first.
# Run it from the root of the repository: it builds the image from it.

services:
  nightshift:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # The name other computers show for this Host.
    hostname: nightshift
    environment:
      NIGHTSHIFT_HOST_ADDRESSES: https://${NIGHTSHIFT_DOMAIN:?Set NIGHTSHIFT_DOMAIN}
    volumes:
      - nightshift:/data
    # No ports: only Caddy reaches it, on the compose network.

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${NIGHTSHIFT_DOMAIN} --to nightshift:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data

volumes:
  nightshift:
  caddy:
