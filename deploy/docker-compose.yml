# Night Shift behind Caddy, which gets and renews the certificate itself.
#
#   NIGHTSHIFT_DOMAIN=nightshift.example.com docker compose -f deploy/docker-compose.yml up -d
#
# Point the domain's DNS at this server and open ports 80 and 443 first.
# Run it from the root of the repository: it builds the image from it.

services:
  nightshift:
    # Or the published image, or your own image built on it:
    # image: xiduzo/nightshift:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # The image's health check marks a Night Shift that stops responding as
    # unhealthy (`docker compose ps`). Compose does not restart it for that:
    # Docker Swarm does (Dokploy).
    # Under Docker Swarm, set `deploy.update_config.order: stop-first`: a
    # second Night Shift on the same volume exits while the first holds the
    # database lease (docs/deploy/public-server.md).
    # The name other computers show for this Host.
    hostname: nightshift
    environment:
      NIGHTSHIFT_HOST_ADDRESSES: https://${NIGHTSHIFT_DOMAIN:?Set NIGHTSHIFT_DOMAIN}
      # People who sign in from another computer must use two-factor sign-in.
      # Give the Host admin a password first (docs/deploy/README.md).
      # NIGHTSHIFT_REQUIRE_TWO_FACTOR: "on"
      # Pushes to the phone app, when its Expo project requires a token.
      # EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}
    volumes:
      - nightshift:/data
    # No ports: only Caddy reaches it, on the compose network.

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${NIGHTSHIFT_DOMAIN} --to nightshift:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data

volumes:
  nightshift:
  caddy:
